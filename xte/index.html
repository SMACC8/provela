<style>
/* 30/09/2026: rifatto piatto sui token della suite (era la palette upstream
   #0b0d10, con sfere lucide e ombre). I colori delle zone restano fissi nei
   tre temi: servono a leggere lo scarto, non sono una preferenza. */
  :root{
    --bg:#060e18; --bg2:#0b1a2c; --panel:#0e2036; --panel2:#0b1a2c; --dp:#040c14;
    --line:#1a3248; --ink:#deedf5; --muted:var(--lab); --sub:var(--lab); --dim:#26405a;
    --green:#1fc964; --yellow:#f3c63a; --orange:#f08a25; --red:#ee3b32;
    --cantiere:#f3c63a;
    --teal:#2BD9C4; --amber:#FFC24B; --coral:#FF6B6B;
  }
  html.day{
    --bg:#eef1f4; --bg2:#e7ecf1; --panel:#ffffff; --panel2:#f3f6f9; --dp:#e7ecf1;
    --line:#a7b5c2; --ink:#0a1420; --muted:#34495b; --sub:#34495b; --dim:#b9c6d2;
    --teal:#067d70; --amber:#8f5600; --coral:#c62020;
  }
  html.night{
    --bg:#0a0202; --bg2:#120303; --panel:#150404; --panel2:#0e0303; --dp:#0a0101;
    --line:#3a1010; --ink:#ff5b5b; --muted:#c85050; --sub:#c85050; --dim:#3a1010;
    --teal:#ff4d4d; --amber:#ff7a45; --coral:#ff5555;
  }
  html.day .rf-topbar{background:linear-gradient(#ffffff,#e7ecf1);border-bottom-color:#a7b5c2;}
  html.night .rf-topbar{background:linear-gradient(#150404,#0e0303);border-bottom-color:#3a1010;}
  html.day [fill="#2BD9C4"]{fill:#067d70;} html.night [fill="#2BD9C4"]{fill:#ff4d4d;}

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans,system-ui,sans-serif);overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto;}
  .page{display:none;flex:1;min-height:0;flex-direction:column;}
  .page.active{display:flex;}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}

  #routeBar{display:flex;align-items:center;gap:10px;padding:10px var(--margine) 0;}
  #routeInfo{flex:1;min-width:0;font-size:var(--t-piccolo);color:var(--teal);font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #routeInfo.none{color:var(--amber);white-space:normal}
  #setOpen{width:var(--tocco);height:var(--tocco);padding:0;font-size:22px;flex:none}

  #setBar{display:flex;gap:8px;padding:10px var(--margine) 0;}
  .setBtn{flex:1;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:12px;
    min-height:var(--tocco);font-size:var(--t-testo);font-weight:650;font-family:inherit;position:relative;}
  .setBtn.on{color:#0b0d10;}
  .setBtn.on[data-mode="auto"]{background:var(--cantiere);border-color:var(--cantiere);}
  .setBtn.on[data-mode="largo"]{background:var(--green);border-color:var(--green);}
  .setBtn.on[data-mode="stretto"]{background:var(--orange);border-color:var(--orange);}
  .setBtn .eff{position:absolute;top:6px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:0;}

  #navSide{font-size:var(--t-testo);color:var(--muted);margin-top:4px;font-weight:650;letter-spacing:.04em;}

  #indicator{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px var(--margine);}
  #indSvg{width:100%;height:100%;display:block;}

  #gpsRow button{flex:1}
  #gpsBar{display:flex;justify-content:space-between;align-items:center;font-size:var(--t-piccolo);

  .toggle input{width:0;height:0;opacity:0;position:absolute;}
  .sw{width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;}

  .toggle input:checked + .sw{background:var(--green);}
  .toggle input:checked + .sw::after{transform:translateX(22px);}

  /* impostazioni: foglio sopra la pagina (z-index >= 20 per coprire la barra in basso) */
  #pageSet{position:fixed;inset:0;z-index:30;background:var(--bg);}
  #setPage{padding:14px var(--margine) 28px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin:0 auto;}
  .sheetHead{display:flex;align-items:center;justify-content:space-between;font-size:var(--t-titolo)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
  .cardHead{display:flex;align-items:center;gap:8px;font-size:var(--t-testo);font-weight:650;margin-bottom:12px;}
  .cardHead .sub{color:var(--muted);font-weight:400;font-size:var(--t-piccolo);}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;background:currentColor;}
  .thRow{display:flex;gap:10px;}
  .thRow label{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;color:var(--muted);}

  #trigNum{width:90px;margin-left:8px}

  .trigInfo.set{color:var(--ink);}
  #fileInput{display:none;}
</style>

<script>
/* Fino al 30/09/2026 qui c'era EMBEDDED, 73 punti di un canale a Porto
   Levante: senza rotta scelta XTE misurava lo scarto da quella. Ora senza
   rotta non si misura niente, e lo si dice. */

/* ===== Stato ===== */
let baseRoute=[], route=[], routeName='', routeSrc='', routeTrackId='';
let inverted=false, segIdx=0;

/* ===== Proiezione piano locale ===== */
const R=6371000, D2R=Math.PI/180;
let refLat0=0, refLon0=0, coslat=1;
let projPts=[];
function initProjection(){
  if(!route.length){refLat0=0;refLon0=0;coslat=1;return;}
  let sLat=0,sLon=0; for(const p of route){sLat+=p[0];sLon+=p[1];}
  refLat0=sLat/route.length; refLon0=sLon/route.length; coslat=Math.cos(refLat0*D2R);
}
function toXY(lat,lon){return {x:(lon-refLon0)*D2R*R*coslat, y:(lat-refLat0)*D2R*R};}
function rebuildProjection(){ serveAggancio=true; initProjection(); projPts=route.map(p=>toXY(p[0],p[1])); buildArc(); renderMini(); }

let arcLen=[], totalLen=0;
function buildArc(){
  arcLen=[0]; totalLen=0;
  for(let i=1;i<projPts.length;i++){
    totalLen+=Math.hypot(projPts[i].x-projPts[i-1].x, projPts[i].y-projPts[i-1].y);
    arcLen.push(totalLen);
  }
}
function pointAtArc(d){
  d=Math.max(0,Math.min(totalLen,d));
  let i=1; while(i<arcLen.length && arcLen[i]<d) i++;
  const A=projPts[i-1], B=projPts[i];
  const segLen=arcLen[i]-arcLen[i-1] || 1;
  const t=(d-arcLen[i-1])/segLen;
  const x=A.x+t*(B.x-A.x), y=A.y+t*(B.y-A.y);
  const tx=(B.x-A.x)/segLen, ty=(B.y-A.y)/segLen;
  return {x,y,tx,ty,seg:i-1};
}

/* ===== XTE firmato ===== */
function crossTrack(P,A,B){
  const dx=B.x-A.x, dy=B.y-A.y, len2=dx*dx+dy*dy;
  let t=len2>0?((P.x-A.x)*dx+(P.y-A.y)*dy)/len2:0;
  const projx=A.x+t*dx, projy=A.y+t*dy;
  const dist=Math.hypot(P.x-projx,P.y-projy);
  const cross=dx*(P.y-A.y)-dy*(P.x-A.x);
  const signed=cross>0?-dist:dist;
  return {dist,t,signed};
}
/* Aggancio (30/09/2026): la ricerca normale guarda pochi segmenti dopo
   l'ultimo, e all'accensione partiva dall'inizio della rotta. Acceso il GPS a
   meta' canale, XTE si agganciava a un segmento lontano: numero e lato
   sbagliati. Al primo fix dopo il caricamento della rotta o l'accensione, e
   quando lo scarto supera di molto la soglia rossa, si cerca su tutta la
   rotta, come fa il Cruscotto (followSeed). */
let serveAggancio=true;
function updateXTE(P){
  const n=route.length; if(n<2) return null;
  const look=6; let best=null,bestI=segIdx;
  const tutto=serveAggancio; serveAggancio=false;
  const i0=tutto?0:Math.max(0,segIdx-1), i1=tutto?n-1:Math.min(n-1,segIdx+look);
  for(let i=i0; i<i1; i++){
    const r=crossTrack(P,projPts[i],projPts[i+1]);
    const tc=Math.max(0,Math.min(1,r.t));
    const cx=projPts[i].x+tc*(projPts[i+1].x-projPts[i].x);
    const cy=projPts[i].y+tc*(projPts[i+1].y-projPts[i].y);
    const dc=Math.hypot(P.x-cx,P.y-cy);
    if(best===null||dc<best.dc){best={...r,dc};bestI=i;}
  }
  segIdx=bestI;
  if(!tutto && best.dc>3*sets.largo[2]){ serveAggancio=true; return updateXTE(P); }
  if(best.t>1 && segIdx<n-2) segIdx++;
  return best;
}

/* ===== Set soglie ===== */
let sets={largo:[5,12,25], stretto:[2,5,10]};
let setMode='auto', triggerIdx=null, activeSet='largo';
function resolveActiveSet(){
  if(setMode==='largo'){activeSet='largo';return;}
  if(setMode==='stretto'){activeSet='stretto';return;}
  if(triggerIdx===null){activeSet='largo';return;}
  activeSet=(segIdx>=triggerIdx)?'stretto':'largo';
}
function thresholds(){return sets[activeSet];}
function bandFor(a){const t=thresholds();return a<t[0]?0:a<t[1]?1:a<t[2]?2:3;}
const BAND_INTERVAL=[0,900,450,180];
/* ultima zona in magenta, non in rosso (Sergio, 30/09/2026): sul triangolo di
   un lato il rosso si legge «sinistra», come il verde «dritta». Il verde
   resta solo per «in rotta», quando i triangoli sono spenti. */
const BAND_COLOR=['#1fc964','#f3c63a','#f08a25','#d63aaf'];

/* ===== Audio ===== */
let audioCtx=null,audioOn=false,beepTimer=null,curBand=0,curSide=0;
function ensureAudio(){const AC=window.AudioContext||window.webkitAudioContext;
  if(!audioCtx)audioCtx=new AC(); if(audioCtx.state==='suspended')audioCtx.resume();}
function beep(freq){if(!audioCtx)return;const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+.13);
  o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+.15);}
function freqForSide(s){return s>0?1100:520;}
function scheduleBeeps(){clearTimeout(beepTimer);
  if(!audioOn||curBand===0)return;
  beep(freqForSide(curSide));beepTimer=setTimeout(scheduleBeeps,BAND_INTERVAL[curBand]);}
function updateAudio(signed){
  const band=bandFor(Math.abs(signed));
  const side=signed>0?-1:1;
  const changed=(band!==curBand)||(side!==curSide);
  curBand=band;curSide=side;
  if(audioOn){ if(band===0)clearTimeout(beepTimer); else if(changed)scheduleBeeps(); }
}

/* ===== Indicatore ===== */
const navXteVal=document.getElementById('navXteVal');
const navSide=document.getElementById('navSide');
const triSx=document.getElementById('triSx'), triDx=document.getElementById('triDx');

function cvar(n,f){try{var v=getComputedStyle(document.documentElement).getPropertyValue(n).trim();return v||f;}catch(e){return f;}}
function _miniIdx(a,b,maxN){var out=[],len=b-a;if(len<=0)return[a];var st=Math.max(1,Math.ceil(len/maxN));for(var i=a;i<b;i+=st)out.push(i);out.push(b);return out;}
/* Indicatore. Con una posizione: barca al centro (240,200), tratto in corso
   verso l'alto, 140 px = soglia arancio del set attivo. La traccia si
   disegna dal centro in avanti e all'indietro finche' resta nel riquadro,
   con la punta del verso dove esce in avanti. Senza posizione: la rotta
   intera dentro il cerchio, nord in alto, per vederne la forma. */
const CX=240, CY=200, RC=140;
/* la traccia si ferma al bordo del riquadro (margine 10 px): li' esce la punta del verso */
function _dentro(p){return p.x>=10&&p.x<=470&&p.y>=10&&p.y<=390;}
function _tratto(pts){   /* pts gia' in coordinate schermo, dal piede in fuori */
  var out=[pts[0]];
  for(var i=1;i<pts.length;i++){
    var a=out[out.length-1], b=pts[i];
    if(_dentro(b)){out.push(b);continue;}
    if(!_dentro(a)){break;}
    var lo=0,hi=1;for(var k=0;k<24;k++){var m=(lo+hi)/2;if(_dentro({x:a.x+m*(b.x-a.x),y:a.y+m*(b.y-a.y)}))lo=m;else hi=m;}
    out.push({x:a.x+lo*(b.x-a.x),y:a.y+lo*(b.y-a.y)}); break;
  }
  return out;
}
function renderMini(){
  var g=document.getElementById('trackMini'); if(!g)return;
  var sc=document.getElementById('scaleTxt'), bm=document.getElementById('boatMark');
  if(!projPts||projPts.length<2){g.innerHTML='';if(sc)sc.textContent='';bm.setAttribute('opacity','0');return;}
  var n=projPts.length,i,k,X,Y,fwd,back,str=function(l){return l.map(function(p){return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');};
  if(lastP){
    var bp=toXY(lastP.lat,lastP.lon), si=Math.min(segIdx,n-2);
    var A=projPts[si],B=projPts[si+1];
    var L=Math.hypot(B.x-A.x,B.y-A.y)||1, tx=(B.x-A.x)/L, ty=(B.y-A.y)/L;
    var t=thresholds(); k=RC/Math.max(t[2],0.5);
    var S=function(p){return {x:CX+((p.x-bp.x)*ty-(p.y-bp.y)*tx)*k, y:CY-((p.x-bp.x)*tx+(p.y-bp.y)*ty)*k};};
    /* piede della barca sul tratto in corso: da li' la traccia parte in avanti e all'indietro */
    var tt=Math.max(0,Math.min(L,(bp.x-A.x)*tx+(bp.y-A.y)*ty));
    var piede=S({x:A.x+tx*tt,y:A.y+ty*tt});
    var av=[piede]; for(i=si+1;i<n;i++)av.push(S(projPts[i]));
    var ind=[piede]; for(i=si;i>=0;i--)ind.push(S(projPts[i]));
    fwd=_tratto(av); back=_tratto(ind);
    if(sc)sc.textContent='cerchio '+(t[2]<10?t[2].toFixed(1):Math.round(t[2]))+' m';
    bm.setAttribute('opacity','1');
  }else{
    var minx=Infinity,maxx=-Infinity,miny=Infinity,maxy=-Infinity;
    for(i=0;i<n;i++){var p=projPts[i];if(p.x<minx)minx=p.x;if(p.x>maxx)maxx=p.x;if(p.y<miny)miny=p.y;if(p.y>maxy)maxy=p.y;}
    k=Math.min(190/Math.max(1,maxx-minx),190/Math.max(1,maxy-miny));
    var mx=(minx+maxx)/2,my=(miny+maxy)/2;
    fwd=_miniIdx(0,n-1,300).map(function(j){return {x:CX+(projPts[j].x-mx)*k,y:CY-(projPts[j].y-my)*k};});
    back=[];
    if(sc)sc.textContent='rotta intera · nord in alto';
    bm.setAttribute('opacity','0');
  }
  var out='';
  if(back.length>1)out+='<polyline class="traccia" points="'+str(back)+'"/>';
  if(fwd.length>1)out+='<polyline class="traccia" points="'+str(fwd)+'" marker-end="url(#mVerso)"/>';
  g.innerHTML=out;
}
function spegniTriangoli(){
  [triSx,triDx].forEach(function(t){t.classList.remove('on');t.style.fill='';});
}
function render(r){
  if(!r){return;}
  resolveActiveSet(); updateSetBadge();
  const m=r.dist, band=bandFor(m), col=BAND_COLOR[band];
  navXteVal.textContent=m<10?m.toFixed(1):Math.round(m);
  navXteVal.style.color=col;
  spegniTriangoli();
  if(band===0){
    navSide.textContent='in rotta';
  }else{
    /* signed>0: la barca e' a destra della rotta, si corregge a sinistra.
       Si accende il triangolo di destra, che punta a sinistra. */
    const toLeft=r.signed>0, tri=toLeft?triDx:triSx;
    tri.classList.add('on'); tri.style.fill=col;
    navSide.textContent=toLeft?'◀ correggi a sinistra':'correggi a destra ▶';
  }
  navSide.style.color=col;
  updateAudio(r.signed);
  renderMini();
}

/* ===== Badge set ===== */
const setBtns=[...document.querySelectorAll('.setBtn')];
function updateSetBadge(){
  setBtns.forEach(b=>{
    b.classList.toggle('on', b.dataset.mode===setMode);
    b.classList.remove('effOn');
  });
  if(setMode==='auto'){
    const eff=setBtns.find(b=>b.dataset.mode===activeSet);
    if(eff)eff.classList.add('effOn');
  }
}
setBtns.forEach(b=>b.addEventListener('click',()=>{
  setMode=b.dataset.mode; resolveActiveSet(); updateSetBadge(); recompute();
}));

/* ===== GPS reale ===== */
const gpsState=document.getElementById('gpsState');
const gpsAcc=document.getElementById('gpsAcc');
let watchId=null, wakeLock=null, lastP=null;

function onFix(pos){
  lastP={lat:pos.coords.latitude, lon:pos.coords.longitude, acc:pos.coords.accuracy};
  const P=toXY(lastP.lat, lastP.lon);
  const r=updateXTE(P);
  gpsState.textContent=route.length<2?'nessuna rotta':'segmento '+(segIdx+1)+'/'+(route.length-1);
  gpsState.className='live';
  gpsAcc.textContent='±'+Math.round(lastP.acc)+' m';
  render(r);
}
function onErr(e){
  gpsState.textContent = e.code===1 ? 'permesso GPS negato' : 'GPS: '+e.message;
  gpsState.className='err';
}
async function startGPS(){
  serveAggancio=true;
  if(!navigator.geolocation){ gpsState.textContent='GPS non disponibile'; gpsState.className='err'; return; }
  watchId=navigator.geolocation.watchPosition(onFix,onErr,
    rfGpsOpt({maximumAge:1000,timeout:12000}));
  try{ if('wakeLock' in navigator){ wakeLock=await navigator.wakeLock.request('screen'); } }catch(e){}
}
/* Preferenza GPS condivisa (rf-topbar.js). Il ripiego serve perche' la
   barra e' caricata con defer: se questo script gira prima, si usa il
   comportamento storico, cioe' GPS diretto. */
function rfGpsOpt(o){var g=window.rfGeo;
  return (g&&typeof g.opzioni==="function")?g.opzioni(o):(o.enableHighAccuracy=true,o);}
function stopGPS(){
  if(watchId!==null){ navigator.geolocation.clearWatch(watchId); watchId=null; }
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  clearTimeout(beepTimer); curBand=0;
  gpsState.textContent='GPS spento'; gpsState.className=''; gpsAcc.textContent='';
  navSide.textContent='GPS in pausa';
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && watchId!==null && 'wakeLock' in navigator && !wakeLock){
    navigator.wakeLock.request('screen').then(w=>wakeLock=w).catch(()=>{});
  }
});
// rifà il render con l'ultima posizione nota (dopo cambio set/soglie/trigger)
function recompute(){
  salva();
  if(lastP===null) return;
  const r=updateXTE(toXY(lastP.lat,lastP.lon));
  render(r);
}

/* ===== Avvio/stop GPS ===== */
const startBtn=document.getElementById('startBtn');
let gpsOn=false;
startBtn.addEventListener('click',()=>{
  ensureAudio();
  gpsOn=!gpsOn;
  startBtn.classList.toggle('on',gpsOn);
  startBtn.textContent=gpsOn?'■ Ferma GPS':'▶ Avvia GPS';
  if(gpsOn){ startGPS(); } else { stopGPS(); }
});

/* ===== Audio / Inversa ===== */
document.getElementById('audChk').addEventListener('change',e=>{
  audioOn=e.target.checked;
  if(audioOn){ensureAudio(); if(curBand>0)scheduleBeeps();} else clearTimeout(beepTimer);
  salva();
});
document.getElementById('invChk').addEventListener('change',e=>{
  inverted=e.target.checked;
  if(triggerIdx!==null) triggerIdx=baseRoute.length-1-triggerIdx;
  route=inverted?baseRoute.slice().reverse():baseRoute.slice();
  segIdx=0; rebuildProjection(); updateTrigInfo(); resolveActiveSet(); updateSetBadge();
  mostraRotta(); recompute();
});

/* ===== Soglie ===== */
function loadThresholdInputs(){
  ['largo','stretto'].forEach(k=>{for(let i=0;i<3;i++)document.getElementById(k+i).value=sets[k][i];});
}
function bindThresholdInputs(){
  ['largo','stretto'].forEach(k=>{for(let i=0;i<3;i++){
    const el=document.getElementById(k+i);
    el.addEventListener('change',()=>{
      let v=parseFloat(el.value); if(isNaN(v)||v<0)v=0;
      sets[k][i]=v;
      if(i>0&&sets[k][i]<sets[k][i-1]){sets[k][i]=sets[k][i-1];el.value=sets[k][i];}
      recompute();
    });
  }});
}

/* ===== Trigger (numero waypoint) ===== */
const trigInfo=document.getElementById('trigInfo');
const trigNum=document.getElementById('trigNum');
function updateTrigInfo(){
  if(triggerIdx===null){
    trigInfo.textContent='Nessun punto. Scrivi il numero del waypoint da cui passare al set Stretto (1–'+route.length+').';
    trigInfo.classList.remove('set');
    trigNum.value='';
  }else{
    trigInfo.textContent='Cambio al waypoint '+(triggerIdx+1)+'/'+route.length+'. Da lì in poi: Stretto.';
    trigInfo.classList.add('set');
    trigNum.value=triggerIdx+1;
  }
}
trigNum.addEventListener('change',()=>{
  let n=parseInt(trigNum.value,10);
  if(isNaN(n)){ triggerIdx=null; updateTrigInfo(); resolveActiveSet(); updateSetBadge(); recompute(); return; }
  n=Math.max(1,Math.min(route.length,n));
  triggerIdx=n-1;            // l'utente conta da 1
  trigNum.value=n;
  updateTrigInfo(); resolveActiveSet(); updateSetBadge(); recompute();
});
document.getElementById('trigClear').addEventListener('click',()=>{
  triggerIdx=null; updateTrigInfo(); resolveActiveSet(); updateSetBadge(); recompute();
});

/* ===== GPX ===== */
const routeInfo=document.getElementById('routeInfo');
document.getElementById('fileInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=ev=>{
    try{
      const xml=new DOMParser().parseFromString(ev.target.result,'application/xml');
      let pts=[...xml.querySelectorAll('trkpt')];
      if(pts.length<2)pts=[...xml.querySelectorAll('rtept')];
      if(pts.length<2){mostraRotta('GPX senza punti');return;}
      baseRoute=pts.map(p=>[parseFloat(p.getAttribute('lat')),parseFloat(p.getAttribute('lon'))]);
      inverted=false; document.getElementById('invChk').checked=false;
      triggerIdx=null; route=baseRoute.slice(); segIdx=0;
      rebuildProjection(); updateTrigInfo(); resolveActiveSet(); updateSetBadge();
      routeSrc='gpx'; routeTrackId=''; routeName=f.name.replace(/\.gpx$/i,'');
      mostraRotta(); recompute();
    }catch(err){mostraRotta('errore nella lettura del GPX');}
  };
  rd.readAsText(f);
});

/* ===== Traccia attiva (raffyca-active-track) ===== */
function tracciaAttiva(){
  var id='';try{id=localStorage.getItem('raffyca-active-track')||'';}catch(e){}
  if(!id)return null;
  var trk=null;try{trk=(JSON.parse(localStorage.getItem('raffyca-tracks')||'[]')).find(function(t){return t.id===id;});}catch(e){}
  return (trk&&trk.pts&&trk.pts.length>=2)?trk:null;
}
function loadActiveTrack(){
  var trk=tracciaAttiva();
  if(!trk){mostraRotta('nessuna traccia attiva nella Carta');return;}
  baseRoute=trk.pts.filter(function(p){return isFinite(p[0])&&isFinite(p[1]);}).map(function(p){return [p[0],p[1]];});
  inverted=false; var ic=document.getElementById('invChk'); if(ic)ic.checked=false;
  triggerIdx=null; route=baseRoute.slice(); segIdx=0;
  rebuildProjection(); updateTrigInfo(); resolveActiveSet(); updateSetBadge();
  routeSrc='track'; routeTrackId=trk.id; routeName=trk.name||'traccia';
  mostraRotta(); recompute();
}
document.getElementById('loadActive').addEventListener('click',loadActiveTrack);

/* ===== Impostazioni: foglio (erano una seconda barra a schede) ===== */
const pageSet=document.getElementById('pageSet');
/* il foglio parte sotto la barra in alto, che sta sopra tutto */
document.getElementById('setOpen').addEventListener('click',()=>{
  const tb=document.querySelector('.rf-topbar');
  pageSet.style.top=(tb?Math.max(0,tb.getBoundingClientRect().bottom):0)+'px';
  pageSet.classList.add('active');
});
document.getElementById('setClose').addEventListener('click',()=>{pageSet.classList.remove('active');renderMini();});

/* ===== Memoria (raffyca-xte) =====
   Prima non si ricordava niente: a ogni riapertura soglie, set, GPX e
   interruttori tornavano ai valori di fabbrica, e la rotta a quella di
   Levante. Il GPX si tiene coi suoi punti; la traccia attiva si rilegge
   dalla Carta a ogni apertura, cosi' se la si cambia la' XTE la segue. */
const K_XTE='raffyca-xte';
function salva(){
  try{localStorage.setItem(K_XTE,JSON.stringify({sets:sets,setMode:setMode,triggerIdx:triggerIdx,
    audio:audioOn,inverted:inverted,src:routeSrc,trackId:routeTrackId,name:routeName,
    gpx:routeSrc==='gpx'?baseRoute:null}));}catch(e){}
}
function mostraRotta(msg){
  if(msg){routeInfo.textContent=msg;routeInfo.className='none';return;}
  if(baseRoute.length<2){
    routeInfo.textContent='Nessuna rotta: attiva una traccia dalla Carta, o carica un GPX dal ⚙.';
    routeInfo.className='none'; navSide.textContent='nessuna rotta'; return;
  }
  routeInfo.className='';
  routeInfo.textContent=(routeSrc==='track'?'◎ ':'GPX · ')+routeName+' · '+baseRoute.length+' punti'+(inverted?' · inversa':'');
}
function ripristina(){
  var m=null;try{m=JSON.parse(localStorage.getItem(K_XTE)||'null');}catch(e){}
  m=m||{};
  ['largo','stretto'].forEach(function(k){
    var v=m.sets&&m.sets[k];
    if(v&&v.length===3&&v.every(function(x){return isFinite(x)&&x>=0;}))sets[k]=v.map(Number);
  });
  if(['auto','largo','stretto'].indexOf(m.setMode)>=0)setMode=m.setMode;
  audioOn=!!m.audio; document.getElementById('audChk').checked=audioOn;
  var stessa=false;
  if(m.src==='gpx'&&m.gpx&&m.gpx.length>=2){
    baseRoute=m.gpx; routeSrc='gpx'; routeName=m.name||'GPX'; stessa=true;
  }else{
    var trk=tracciaAttiva();
    if(trk){
      baseRoute=trk.pts.filter(function(p){return isFinite(p[0])&&isFinite(p[1]);}).map(function(p){return [p[0],p[1]];});
      routeSrc='track'; routeTrackId=trk.id; routeName=trk.name||'traccia';
      stessa=(m.src==='track'&&m.trackId===trk.id);
    }
  }
  /* senso e cambio automatico valgono solo per la rotta su cui erano stati scelti */
  if(stessa){
    inverted=!!m.inverted;
    if(m.triggerIdx!=null&&m.triggerIdx>=0&&m.triggerIdx<baseRoute.length)triggerIdx=m.triggerIdx;
  }
  document.getElementById('invChk').checked=inverted;
  route=inverted?baseRoute.slice().reverse():baseRoute.slice();
}

/* ===== Init ===== */
ripristina();
loadThresholdInputs(); bindThresholdInputs();
rebuildProjection(); updateTrigInfo(); resolveActiveSet(); updateSetBadge();
mostraRotta(); salva();
/* rientrando nella pagina: se la traccia attiva e' cambiata nella Carta, si segue */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||routeSrc==='gpx')return;
  var trk=tracciaAttiva();
  if(trk&&trk.id!==routeTrackId)loadActiveTrack();
});

/* ===== PWA ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
