<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Carta Nautica · ProVela</title>
<script>(function(){try{var t=localStorage.getItem('raffyca-theme');if(t==='sun')t='day';if(t==='day'||t==='night')document.documentElement.classList.add(t);}catch(e){}})();</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#060e18;--panel:#0e2036;--panel2:#0b1a2c;--dp:#040c14;--line:#1a3248;--dim:#122030;
  --ink:#deedf5;--sub:#5a7a94;--teal:#2BD9C4;--amber:#FFC24B;--coral:#FF6B6B;--green:#46d68a;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",sans-serif;}
/* TEMA GIORNO (alto contrasto per il sole) */
html.day{
  --bg:#eef1f4; --bg-grad-top:#dbe3ea; --panel:#ffffff; --panel2:#e7ecf1; --dp:#f3f6f9;
  --line:#a7b5c2; --dim:#cdd6de;
  --ink:#0a1420; --sub:#3b4e60; --sub2:#54697b;
  --teal:#067d70; --amber:#8f5600; --coral:#c62020; --green:#12894f;
  --bezel-hi:#ffffff; --bezel-mid:#d6dde4; --bezel-lo:#b6c2ce;
}
/* TEMA NOTTE (rosso, visione notturna) */
html.night{
  --bg:#0a0202; --bg-grad-top:#180404; --panel:#150404; --panel2:#0e0303; --dp:#0a0101;
  --line:#3a1010; --dim:#200707;
  --ink:#ff5b5b; --sub:#b04040; --sub2:#8a3030;
  --teal:#ff4d4d; --amber:#ff7a45; --coral:#ff5555; --green:#c23a3a;
  --bezel-hi:#3a1010; --bezel-mid:#200707; --bezel-lo:#120404;
}
/* topbar: sfondo per Giorno/Notte (in Scuro resta il gradiente originale) */
html.day .rf-topbar{background:linear-gradient(#ffffff,#e7ecf1);border-bottom-color:#a7b5c2;}
html.night .rf-topbar{background:linear-gradient(#150404,#0e0303);border-bottom-color:#3a1010;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;}
.wrap{padding:10px;display:flex;flex-direction:column;gap:10px;}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
h1{font-size:15px;letter-spacing:.06em;color:var(--teal);text-transform:uppercase;margin-right:auto;}
#map{width:100%;height:46vh;min-height:280px;border-radius:12px;border:1px solid var(--line);background:#0A1628;}
.leaflet-control-layers{background:var(--panel)!important;color:var(--ink)!important;border:1px solid var(--line)!important;}
select,button,input,textarea{font-family:var(--sans);color:var(--ink);}
.sel{font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--dp);}
.btn{font-size:13px;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.btn:active{transform:scale(.97);}
.btn.go{border-color:var(--teal);color:var(--teal);}
.btn.sm{padding:6px 9px;font-size:12px;}
.tabs{display:flex;gap:8px;}
.tabs button{flex:1;font-family:var(--mono);font-size:13px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);cursor:pointer;}
.tabs button.on{border-color:var(--teal);color:var(--teal);background:rgba(43,217,196,.08);}
.list{display:flex;flex-direction:column;gap:8px;}
.item{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:10px;}
.item.active{border-color:var(--teal);box-shadow:inset 0 0 0 1px rgba(43,217,196,.4);}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px rgba(0,0,0,.5);}
.it-main{flex:1;min-width:0;}
.it-name{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.it-sub{font-size:11.5px;color:var(--sub);font-family:var(--mono);margin-top:2px;}
.it-note{font-size:11.5px;color:#8ea8bd;margin-top:3px;font-style:italic;}
.it-acts{display:flex;gap:6px;flex:0 0 auto;}
.chk{width:18px;height:18px;accent-color:var(--teal);flex:0 0 auto;}
.fhead{display:flex;align-items:center;gap:7px;padding:8px 4px 5px;margin-top:8px;border-bottom:1px solid var(--line);font:600 12px ui-monospace,monospace;color:var(--sub);letter-spacing:.3px;cursor:pointer;user-select:none;-webkit-user-select:none;}
.fhead .fcar{display:inline-block;width:11px;text-align:center;transition:transform .13s ease;flex:none;}
.fhead.closed .fcar{transform:rotate(-90deg);}
.fhead.closed{opacity:.82;}
.fhead .fact button{pointer-events:auto;}
.fhead .fname{color:var(--ink);}
.fhead .fcount{opacity:.55;}
.fhead .fact{margin-left:auto;display:flex;gap:2px;}
.fhead .fact button{background:none;border:none;color:var(--sub);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:6px;}
.fhead .fact button:hover{color:var(--ink);}
.wpico{display:inline-flex;width:24px;height:24px;align-items:center;justify-content:center;flex:none;}
.wpicons{display:flex;flex-wrap:wrap;gap:6px;}
.wpicon{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.wpicon.sel{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset;}
.wpdiv{background:none;border:none;}
.wpmark{display:flex;align-items:center;justify-content:center;}
.wpmark svg{filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9)) drop-shadow(0 0 1px rgba(0,0,0,.7));}
.wpmark.act svg{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 3px rgba(0,0,0,.85));}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.iconbtn.on{border-color:var(--teal);color:var(--teal);}
.iconbtn.del{color:var(--coral);border-color:rgba(255,107,107,.3);}
.empty{color:var(--sub);font-size:13px;text-align:center;padding:18px;}
.ov{position:fixed;inset:0;background:rgba(4,10,18,.72);display:none;align-items:flex-end;justify-content:center;z-index:9500;}
.ov.on{display:flex;}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;padding:16px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto;}
.sheet h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);}
.field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);display:block;margin-bottom:5px;}
.field input,.field textarea{width:100%;font-size:14px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--dp);color:var(--ink);}
.field textarea{resize:vertical;min-height:52px;font-family:var(--sans);}
.tags{display:flex;gap:8px;flex-wrap:wrap;}
.tagchip{width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.tagchip.sel{border-color:#fff;transform:scale(1.1);}
.row{display:flex;gap:9px;}
.row .btn{flex:1;justify-content:center;}
.hint{font-size:11px;color:var(--sub);}
.tool{font-size:12px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.tool.on{border-color:var(--teal);color:var(--teal);background:rgba(43,217,196,.08);}
.readout{font-family:var(--mono);font-size:12px;color:var(--teal);margin-right:auto;}
.readout b{color:var(--amber);}
.grid-lbl{font-family:var(--mono);font-size:10px;color:#7fd9cf;background:rgba(6,14,24,.6);padding:0 3px;border-radius:3px;white-space:nowrap;}
.zone-lbl{font-family:var(--mono);font-size:10px;color:var(--amber);background:rgba(6,14,24,.65);padding:1px 4px;border-radius:4px;white-space:nowrap;border:1px solid rgba(255,194,75,.35);}
.leaflet-container{background:#0A1628;}
.leaflet-tooltip.fari-lbl{background:rgba(10,14,15,.82);border:none;color:#fff;font:600 11px ui-monospace,monospace;padding:2px 5px;box-shadow:none;}
.leaflet-tooltip.fari-lbl:before{display:none;}
.leaflet-popup.fari-pop .leaflet-popup-content-wrapper,
.leaflet-popup.fari-pop .leaflet-popup-tip{background:#ffffff!important;}
.leaflet-popup.fari-pop .leaflet-popup-content{font:600 12px ui-monospace,monospace;color:#12242e!important;}
.leaflet-popup.fari-pop .leaflet-popup-content b{color:#0b1d26!important;}
.fari-pop .frsep{margin-top:7px;border-top:1px solid rgba(0,0,0,.22);padding-top:6px;color:#3d5563!important;}
.leaflet-popup.fari-pop a.frsib{display:block;color:#0a4a42!important;font-weight:700;text-decoration:none;
  padding:7px 2px;border-bottom:1px solid rgba(0,0,0,.10);}
.leaflet-popup.fari-pop a.frsib:last-child{border-bottom:none;}
.leaflet-popup.fari-pop a.frsib:active{background:rgba(10,74,66,.14);}
.fari-hit{background:transparent;}
</style>
</head>
<body>
<!-- ===== rf-topbar: markup canonico. CSS e logica stanno in ../rf-topbar.js
     (un solo file per tutta la suite). Il link alla home resta QUI, inline:
     e' l'unico modo per uscire da un modulo e non deve dipendere da nulla. ===== -->
<div class="rf-topbar" role="banner">
  <a class="rf-home" href="../" aria-label="Menu ProVela" title="Menu ProVela">
    <svg viewBox="0 0 64 64" width="19" height="19" aria-hidden="true"><path d="M32 8 L32 56 L10 56 Z" fill="#2BD9C4" opacity=".95"/><path d="M32 26 L54 56 L32 56 Z" fill="#2BD9C4" opacity=".45"/><line x1="32" y1="6" x2="32" y2="58" stroke="#1a4a42" stroke-width="3"/></svg>
  </a>
  <span class="rf-boat" id="rfBoat"></span>
  <span class="rf-gps" id="rfGps" title="Stato GPS"><span class="gdot"></span></span>
  <span class="rf-pol" id="rfPol" title=""></span>
  <span class="rf-spacer"></span>
  <span class="rf-status" id="rfStatus"></span>
</div>
<script src="../rf-topbar.js" defer></script>
<script src="../rf-live.js"></script>
<!-- ===== /rf-topbar ===== -->

<div class="wrap">
  <div class="bar">
    <h1>Carta Nautica</h1>
    <select class="sel" id="filter" title="Filtro visualizzazione"><option value="all">Tutte</option><option value="active">Solo attivo</option></select>
  </div>

  <div id="map"></div>

  <div class="bar">
    <button class="btn go" id="addHere">＋ WP qui (GPS)</button>
    <button class="btn sm" id="addCoord">＋ per coordinate</button>
    <button class="btn sm" id="impGpx">↧ Importa GPX</button>
    <button class="btn sm" id="expSel">↥ Esporta selezionati</button>
  </div>
  <div class="bar" id="toolbar">
    <button class="tool" id="tGrid" title="Griglia meridiani/paralleli (1°)">▦ Griglia</button>
    <button class="tool" id="tZone" title="Quadri d'unione zone venti (Traversata)">▭ Zone venti</button>
    <button class="tool" id="tBathy" title="Isobate batimetriche EMODnet (per zona)">≈ Batimetria</button>
    <button class="tool" id="tFari" title="Fari: spicchi di settore e 'cosa vedo da qui'">✦ Fari</button>
    <button class="tool" id="tDraw" title="Disegna una traccia sulla carta">✎ Traccia</button>
    <button class="tool" id="tMeas" title="Misura distanza e rotta tra due punti">📐 Misura</button>
  </div>
  <div class="bar" id="drawCtl" style="display:none">
    <span class="readout" id="drawInfo">Tocca la carta per aggiungere punti.</span>
    <button class="btn sm" id="drawUndo">↶ Punto</button>
    <button class="btn sm" id="drawCancel">Annulla</button>
    <button class="btn go sm" id="drawDone">✓ Salva</button>
  </div>
  <div class="bar" id="measCtl" style="display:none">
    <span class="readout" id="measInfo">Tocca due punti sulla carta.</span>
    <button class="btn sm" id="measCancel">Chiudi</button>
  </div>
  <div class="bar" id="fariCtl" style="display:none">
    <span class="readout" id="fariInfo">Fari: —</span>
    <button class="tool" id="fariModeSett">◑ Settori</button>
    <button class="tool" id="fariModeVedo">👁 Cosa vedo</button>
  </div>
  <div class="hint" id="posInfo">posizione: —</div>
  <input type="file" id="fileGpx" accept=".gpx" hidden>

  <div class="tabs">
    <button data-t="wpt" class="on" id="tabWpt">Waypoint <span id="nW">0</span></button>
    <button data-t="trk" id="tabTrk">Tracce <span id="nT">0</span></button>
    <button id="newFolder" title="Nuova cartella" style="margin-left:auto;flex:none">🗂＋</button>
  </div>
  <div class="list" id="list"></div>
</div>

<div class="ov" id="ov">
  <div class="sheet">
    <h3 id="ovTitle">Nuovo waypoint</h3>
    <div class="field" id="ovCoordField">
      <label>Coordinate — decimali (45.65) oppure gradi-primi (45 39.0 N)</label>
      <div class="row"><input id="ovLat" placeholder="Lat (es. 45 39.0 N)"><input id="ovLon" placeholder="Lon (es. 13 46.2 E)"></div>
      <div class="hint" id="ovCoordHint" style="margin-top:5px"></div>
    </div>
    <div class="field"><label>Nome</label><input id="ovName" placeholder="Es. Molo Sacchetta"></div>
    <div class="field"><label>Nota</label><textarea id="ovNote" placeholder="Opzionale"></textarea></div>
    <div class="field"><label>Tag colore</label><div class="tags" id="ovTags"></div>
      <input id="ovTagName" placeholder="Nome del tag (es. Ancoraggi)" style="margin-top:8px"></div>
    <div class="field" id="ovIconField"><label>Icona</label><div class="wpicons" id="ovIcons"></div></div>
    <div class="field"><label>Cartella</label>
      <div class="row"><select id="ovFolder" class="sel" style="flex:1"></select><button class="btn sm" id="ovFolderNew" type="button" title="Crea una nuova cartella">＋ Nuova</button></div>
    </div>
    <div class="row"><button class="btn" id="ovCancel">Annulla</button><button class="btn go" id="ovSave">Salva</button></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* contratto: raffyca-waypoints [{id,name,lat,lon,ts,tag?,note?}] · raffyca-tracks [{...,tag?,note?}]
   raffyca-active-wp · raffyca-active-track · raffyca-tags {color:nome} · raffyca-pos {lat,lon} */
const $=id=>document.getElementById(id);
const TAGS=[["#8aa0b0","Neutro"],["#2BD9C4","Acqua"],["#FFC24B","Ambra"],["#FF6B6B","Corallo"],["#46d68a","Verde"],["#5b8dff","Blu"],["#C77DFF","Viola"]];
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return[];}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v));}
function actWp(){return localStorage.getItem('raffyca-active-wp')||'';}
function actTrk(){return localStorage.getItem('raffyca-active-track')||'';}
/* ---- stato aperto/chiuso delle cartelle (raffyca-folders-open) -------
   Le cartelle nascono CHIUSE: con molte cartelle un elenco tutto aperto
   e' identico a nessuna cartella, che era il motivo del reclamo. Fa
   eccezione la cartella che contiene l'elemento attivo (WP o traccia),
   che si apre da sola: e' l'unica che serve subito. Lo stato e' per
   cartella e per scheda, e sopravvive al ricaricamento. */
var FOPEN = (function(){ try{ var o=JSON.parse(localStorage.getItem('raffyca-folders-open')||'null'); return (o&&typeof o==='object')?o:{}; }catch(e){ return {}; } })();
function fkey(kind,id){ return kind+':'+(id||'__none__'); }
function fIsOpen(kind,id,autoOpen){
  var k=fkey(kind,id);
  if(Object.prototype.hasOwnProperty.call(FOPEN,k)) return !!FOPEN[k];
  return !!autoOpen;   /* mai deciso dall'utente: aperta solo se contiene l'attivo */
}
function fSetOpen(kind,id,v){
  FOPEN[fkey(kind,id)]=!!v;
  try{ localStorage.setItem('raffyca-folders-open',JSON.stringify(FOPEN)); }catch(e){}
}

/* ---- cartelle WP/tracce (raffyca-folders [{id,name,kind}]; item.folder=id) ---- */
function foldersAll(){return lsGet('raffyca-folders');}
function foldersOf(kind){return foldersAll().filter(function(f){return f.kind===kind;});}
function addFolder(name,kind){name=(name||'').trim();if(!name)return null;var fs=foldersAll();var id='f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);fs.push({id:id,name:name,kind:kind});lsSet('raffyca-folders',fs);return id;}
function renameFolder(id,name){var fs=foldersAll();var f=fs.find(function(x){return x.id===id;});if(f){f.name=name;lsSet('raffyca-folders',fs);}}
function delFolder(id,kind){lsSet('raffyca-folders',foldersAll().filter(function(f){return f.id!==id;}));
  try{delete FOPEN[fkey(kind,id)];localStorage.setItem('raffyca-folders-open',JSON.stringify(FOPEN));}catch(e){}
  var key=kind==='wpt'?'raffyca-waypoints':'raffyca-tracks';var arr=lsGet(key),ch=false;
  arr.forEach(function(x){if(x.folder===id){x.folder='';ch=true;}});if(ch)lsSet(key,arr);}
const R=6371000,rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI;
function hav(a,b){var s=Math.sin(rad(b[0]-a[0])/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(rad(b[1]-a[1])/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function brng(a,b){var y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0])),x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return(deg(Math.atan2(y,x))+360)%360;}
function tagColor(t){return t||"#8aa0b0";}
/* tag nominabili */
function tagsMap(){var d={};TAGS.forEach(t=>d[t[0]]=t[1]);try{Object.assign(d,JSON.parse(localStorage.getItem('raffyca-tags')||'{}'));}catch(e){}return d;}
function tagName(c){return tagsMap()[c]||c;}
var WP_ICONS={
  "pallino":{n:"Pallino",m:"fill",w:"2",s:"<circle cx=\"12\" cy=\"12\" r=\"6\" fill=\"currentColor\"></circle>"},
  "crocino":{n:"Crocino",m:"stroke",w:"2.2",s:"<path d=\"M12 5v14M5 12h14\"></path>"},
  "quadrato":{n:"Quadrato",m:"stroke",w:"2",s:"<rect x=\"5\" y=\"5\" width=\"14\" height=\"14\" rx=\"1.5\"></rect>"},
  "rettangolo":{n:"Rettangolo",m:"stroke",w:"2",s:"<rect x=\"3\" y=\"8\" width=\"18\" height=\"8\" rx=\"1.5\"></rect>"},
  "triangolo":{n:"Triangolo",m:"fill",w:"2",s:"<path d=\"M12 4 L21 20 H3 Z\"></path>"},
  "rombo":{n:"Rombo",m:"fill",w:"2",s:"<path d=\"M12 3 L20 12 L12 21 L4 12 Z\"></path>"},
  "stella":{n:"Stella",m:"fill",w:"2",s:"<path d=\"M12 3 L14.5 9.3 L21 10 L16 14.4 L17.5 21 L12 17.5 L6.5 21 L8 14.4 L3 10 L9.5 9.3 Z\"></path>"},
  "bandiera":{n:"Bandiera",m:"stroke",w:"2",s:"<path d=\"M7 3v18\"></path><path d=\"M7 4 L19 7.5 L7 11 Z\" fill=\"currentColor\" stroke=\"none\"></path>"},
  "barca":{n:"Imbarcazione",m:"fill",w:"0.6",s:"<path d=\"M12 2.5 C15.5 6.8 17 10.3 17 13.5 C17 17.6 14.8 20.5 12 21.5 C9.2 20.5 7 17.6 7 13.5 C7 10.3 8.5 6.8 12 2.5 Z\"></path> <path d=\"M12 4.5 V19\" stroke=\"currentColor\" stroke-width=\"1\" fill=\"none\"></path>"},
  "ancora":{n:"Ancoraggio",m:"stroke",w:"1.8",s:"<circle cx=\"12\" cy=\"5\" r=\"2\"></circle> <path d=\"M12 7v13\"></path> <path d=\"M7 10h10\"></path> <path d=\"M5 14 A7 7 0 0 0 12 20\"></path> <path d=\"M19 14 A7 7 0 0 1 12 20\"></path>"},
  "darsena":{n:"Darsena",m:"stroke",w:"1.8",s:"<path d=\"M3 9h18\"></path> <path d=\"M6 9v6\"></path> <path d=\"M12 9v6\"></path> <path d=\"M18 9v6\"></path> <path d=\"M3 18 q2.2 -2.4 4.5 0 t4.5 0 t4.5 0 t4.5 0\"></path>"},
  "ormeggio":{n:"Ormeggio",m:"stroke",w:"1.8",s:"<ellipse cx=\"12\" cy=\"14\" rx=\"7.5\" ry=\"4\"></ellipse> <rect x=\"9\" y=\"3\" width=\"6\" height=\"13\" rx=\"3\" fill=\"currentColor\" stroke=\"none\"></rect>"},
  "carburante":{n:"Carburante",m:"stroke",w:"1.8",s:"<rect x=\"4\" y=\"7\" width=\"9\" height=\"13\" rx=\"1\"></rect> <path d=\"M7 7V4h3v3\"></path> <path d=\"M13 11h2.5a1.8 1.8 0 0 1 1.8 1.8V17\"></path> <circle cx=\"18.7\" cy=\"9.3\" r=\"1.4\"></circle>"},

/* parser coordinate: decimali, gradi-primi, gradi-primi-secondi, con emisfero N/S/E/W */
function parseCoord(s){s=String(s||'').trim();if(!s)return NaN;
  var neg=/[SWsw]/.test(s)||/^\s*-/.test(s);
  s=s.replace(/[°'"′″]/g,' ').replace(/[NSEWnsew]/g,' ').replace(',','.').trim();
  var p=s.split(/\s+/).map(parseFloat).filter(x=>!isNaN(x));if(!p.length)return NaN;
  var v=Math.abs(p[0])+(p[1]||0)/60+(p[2]||0)/3600;return neg?-v:v;}

/* La carta ora SEGUE il GPS: prima chiedeva la posizione una volta sola
   all'apertura e il puntino restava dov'era. */
var lastFix=null;
function onFix(p){
  var la=p.coords.latitude, lo=p.coords.longitude, t=Date.now();
  var h=p.coords.heading, v=p.coords.speed;
  if(v!=null&&isFinite(v)) SOG=v*1.94384;
  if(h!=null&&isFinite(h)&&SOG!=null&&SOG>=0.5) COG=h;
  else if(lastFix){                       /* rotta dedotta da due fix */
    var dt=(t-lastFix.t)/1000;
    if(dt>1){
      var dLat=(la-lastFix.la)*60, dLon=(lo-lastFix.lo)*60*Math.cos(la*Math.PI/180);
      var d=Math.sqrt(dLat*dLat+dLon*dLon);            /* NM */
      if(SOG==null) SOG=d/(dt/3600);
      if(d>0.0008) COG=(Math.atan2(dLon,dLat)*180/Math.PI+360)%360;
      lastFix={la:la,lo:lo,t:t};
    }
  }else lastFix={la:la,lo:lo,t:t};
  POS=[la,lo];
  try{localStorage.setItem('raffyca-pos',JSON.stringify({lat:la,lon:lo,ts:t,
    sog:SOG==null?undefined:SOG,cog:COG==null?undefined:COG}));}catch(e){}
  updatePosInfo();drawPosMarker();drawRecTrail();
}
if(navigator.geolocation){

var MVKEY='raffyca-map-view';

  return (v&&v.c&&isFinite(v.c[0])&&isFinite(v.c[1])&&isFinite(v.z))?v:null;}catch(e){return null;}}
var SYNCV=syncViewOn(), SV=SYNCV?sharedView():null;
/* mappa: basi selezionabili + overlay simboli nautici OpenSeaMap.
   Base "Nautica (chiara)" = poche strade, acqua chiara: i simboli nautici risaltano, aspetto vicino a una carta.
   NB: erano tile CARTO (Voyager e Positron). Dal 2026 CARTO richiede una API key e
   senza chiave stampa "API KEY REQUIRED" sopra ogni tile, quindi sono state sostituite.
   La base "Minimal" e' caduta: senza chiave non esiste un equivalente del Positron
   (gli stili minimali gratuiti rendono mare e terra dello stesso grigio, inaccettabile
   su una carta nautica). Le viste salvate con base:'minimal' ricadono su 'nautica'. */
/* Le basi vivono in un pane proprio ('basePane', z 150) SOTTO il tilePane (200), dove
   stanno i simboli OpenSeaMap, e sotto tutti gli altri pane (griglia 350, fari 360,
   isobate e tracce in overlayPane 400). Senza, L.control.layers assegna da se' uno
   z-index crescente alle basi man mano che le registra: la terza base finisce SOPRA
   il seamark, che sta nello stesso pane, e i simboli nautici spariscono. Il pane
   rende la cosa strutturale invece che dipendente dall'ordine delle voci. */
var baseNautica=L.tileLayer('https://tile-{s}.openstreetmap.fr/hot/{z}/{x}/{y}.png',{pane:'basePane',maxZoom:19,subdomains:'abc',attribution:'© OpenStreetMap · Humanitarian OSM Team'});
var baseOSM=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{pane:'basePane',maxZoom:19,attribution:'© OpenStreetMap'});
/* Satellite = immagini + etichette. Le immagini da sole non portano un solo toponimo:
   riconoscere una cala e' un conto, sapere come si chiama il paese davanti e' un altro.
   "World Boundaries and Places" e' il layer di sole scritte che Esri pubblica apposta
   per stare sopra World_Imagery: trasparente, gratuito, senza chiave. */
var ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
var baseSat=L.layerGroup([
  L.tileLayer(ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}',{pane:'basePane',maxZoom:19,attribution:'© Esri · Maxar · Earthstar Geographics'}),
  L.tileLayer(ESRI+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{pane:'basePane',maxZoom:19})
]);
var seamark=L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png',{maxZoom:19,opacity:1,attribution:'© OpenSeaMap'});
/* Ordine di precedenza dell'inquadratura: vista condivisa (se agganciata) >

var VIEW0=SV||(CV&&CV.c?{c:CV.c,z:CV.z}:null);

map.createPane('basePane');map.getPane('basePane').style.zIndex=150;   /* prima di aggiungere le basi */
((CV&&CV.base==='osm')?baseOSM:(CV&&CV.base==='sat')?baseSat:baseNautica).addTo(map);if(!CV||CV.sea!==false)seamark.addTo(map);
L.control.layers({'Nautica (chiara)':baseNautica,'OpenStreetMap':baseOSM,'Satellite':baseSat},{'Simboli nautici (OpenSeaMap)':seamark},{collapsed:true}).addTo(map);

function drawGrid(){gridLayer.clearLayers();if(!gridOn)return;
  var b=map.getBounds(),S=b.getSouth(),N=b.getNorth(),W=b.getWest(),E=b.getEast();
  var s=Math.floor(S),n=Math.ceil(N),w=Math.floor(W),e=Math.ceil(E);
  if(n-s>80||e-w>80)return; // troppo lontano: evita migliaia di linee
  for(var la=s;la<=n;la++){L.polyline([[la,W],[la,E]],{pane:'gridPane',color:'#2BD9C4',weight:.6,opacity:.35,interactive:false}).addTo(gridLayer);
    L.marker([la,W],{pane:'gridPane',icon:lbl('grid-lbl',fmtLat(la),[-4,7]),interactive:false,keyboard:false}).addTo(gridLayer);}
  for(var lo=w;lo<=e;lo++){L.polyline([[S,lo],[N,lo]],{pane:'gridPane',color:'#2BD9C4',weight:.6,opacity:.35,interactive:false}).addTo(gridLayer);}
  // etichette meridiani: inserite ~26px sopra il bordo sud, così non finiscono clippate/coperte (tablet)
  var sPt=map.latLngToContainerPoint(L.latLng(S,w)),lonLat=map.containerPointToLatLng(L.point(sPt.x,sPt.y-26)).lat;

/* ===== gestione modalità carta: normale | disegno traccia | misura ===== */

  mapMode=m;
  $('tDraw').classList.toggle('on',m==='draw');
  $('tMeas').classList.toggle('on',m==='meas');

/* --- disegno traccia --- */
var drawPts=[], drawLine=null, drawDots=L.layerGroup().addTo(map);
function refreshDraw(){if(drawLine){map.removeLayer(drawLine);drawLine=null;}drawDots.clearLayers();
  if(drawPts.length){drawLine=L.polyline(drawPts,{color:'#2BD9C4',weight:3,dashArray:'6 4'}).addTo(map);
    drawPts.forEach(function(p){L.circleMarker(p,{radius:3,color:'#fff',weight:1,fillColor:'#2BD9C4',fillOpacity:1}).addTo(drawDots);});}
  var d=0;for(var i=1;i<drawPts.length;i++)d+=hav(drawPts[i-1],drawPts[i]);
  $('drawInfo').textContent=drawPts.length+' punti · '+(d/1852).toFixed(2)+' NM';}
function startDraw(){drawPts=[];refreshDraw();setMode('draw');}
function drawUndo(){drawPts.pop();refreshDraw();}
function endDraw(save){
  if(save){
    if(drawPts.length<2){alert('Servono almeno 2 punti.');return false;}
    var d=0;for(var i=1;i<drawPts.length;i++)d+=hav(drawPts[i-1],drawPts[i]);
    var nm=prompt('Nome traccia:','Traccia '+(lsGet('raffyca-tracks').length+1));
    if(nm!==null){var trks=lsGet('raffyca-tracks');
      trks.push({id:'t'+Date.now(),name:(nm.trim()||'Traccia'),ts:Date.now(),pts:drawPts.map(p=>[p[0],p[1],0]),dist:+(d/1852).toFixed(2),dur:0,tag:'#2BD9C4'});
      lsSet('raffyca-tracks',trks);}
  }
  drawPts=[];if(drawLine){map.removeLayer(drawLine);drawLine=null;}drawDots.clearLayers();render();return true;}

/* --- misura distanza/rotta tra due punti --- */
var measPts=[], measLine=null, measMk=L.layerGroup().addTo(map);

function startMeas(){measReset();$('measInfo').textContent='Tocca due punti sulla carta.';setMode('meas');}
function measAdd(ll){
  if(measPts.length>=2)measReset();
  measPts.push([ll.lat,ll.lng]);
  L.circleMarker(measPts[measPts.length-1],{radius:5,color:'#fff',weight:2,fillColor:'#FFC24B',fillOpacity:1}).addTo(measMk);
  if(measPts.length===2){measLine=L.polyline(measPts,{color:'#FFC24B',weight:2,dashArray:'6 4'}).addTo(map);
    var d=hav(measPts[0],measPts[1])/1852,b=brng(measPts[0],measPts[1]);
    $('measInfo').innerHTML='Dist <b>'+d.toFixed(2)+' NM</b> · Rotta <b>'+String(Math.round(b)).padStart(3,'0')+'°</b>';}
  else $('measInfo').textContent='Punto A fissato — tocca il punto B.';}
function endMeas(){measReset();$('measInfo').textContent='Tocca due punti sulla carta.';}

/* --- click/tocco sulla carta secondo modalità --- */
function onMapPoint(e){
  if(mapMode==='draw'){drawPts.push([e.latlng.lat,e.latlng.lng]);refreshDraw();return;}
  if(mapMode==='meas'){measAdd(e.latlng);return;}

/* filtro */
function rebuildFilter(){var f=$('filter'),cur=f.value;
  var tags=[...new Set(lsGet('raffyca-waypoints').concat(lsGet('raffyca-tracks')).map(x=>x.tag).filter(Boolean))];
  var kind=(typeof tab!=='undefined'?tab:'wpt');var fol=foldersOf(kind);
  var folOpts=fol.length?('<option value="folder:__none__">Senza cartella</option>'+fol.map(function(fo){return '<option value="folder:'+fo.id+'">Cartella: '+esc(fo.name)+'</option>';}).join('')):'';

var ISO_COL={"-5":"#8fe3ff","-10":"#2BD9C4","-20":"#46d68a","-50":"#FFC24B","-100":"#FF6B6B","-200":"#c792ea","-500":"#f78fb3","-1000":"#9aa7ff"};

var isoOn=false, isoLayer=L.layerGroup(), isoCache={}, isoCurSlug=null;
function isoZoneAt(lat,lon){var hit=null;Object.keys(ZONE_BOX).forEach(function(z){var b=ZONE_BOX[z];if(!hit&&lat<=b.latN&&lat>=b.latS&&lon>=b.lonW&&lon<=b.lonE)hit=z;});return hit;}
function isoStyleF(f){var d=f.properties.depth;return{color:(ISO_COL[String(d)]||"#6b7f95"),weight:(d>=-50?1.1:0.8),opacity:.85};}
function isoRender(j){
  isoLayer.clearLayers();
  L.geoJSON(j,{style:function(){return{color:"#000",weight:12,opacity:0};},onEachFeature:function(f,layer){layer.bindPopup((-f.properties.depth)+" m");}}).addTo(isoLayer);
  L.geoJSON(j,{interactive:false,style:isoStyleF}).addTo(isoLayer);

  (j.features||[]).forEach(function(f){var d=f.properties.depth;if(lab.indexOf(d)<0)return;var g=f.geometry;if(!g)return;var cs=g.type==="LineString"?g.coordinates:(g.coordinates[0]||[]);if(cs.length<8)return;(byd[d]=byd[d]||[]).push(cs);});
  Object.keys(byd).forEach(function(d){byd[d].sort(function(a,b){return b.length-a.length;});byd[d].slice(0,3).forEach(function(cs){var m=cs[Math.floor(cs.length/2)];L.marker([m[1],m[0]],{interactive:false,keyboard:false,icon:L.divIcon({className:"",html:'<span style="font:600 10px var(--mono,monospace);color:'+(ISO_COL[String(d)]||"#9fb0c0")+';background:rgba(6,14,24,.72);padding:0 3px;border-radius:3px">'+(-d)+'</span>',iconSize:[26,12]})}).addTo(isoLayer);});});
}
function isoRefresh(){
  if(!isoOn)return;
  var c=map.getCenter(),z=isoZoneAt(c.lat,c.lng),slug=z?ISO_SLUG[z]:null;
  if(!slug)return;
  if(slug===isoCurSlug)return;

  fetch("../routing/isobate/isobate_"+slug+".geojson").then(function(r){return r.json();}).then(function(j){isoCache[slug]=j;if(isoOn&&isoCurSlug===slug)isoRender(j);}).catch(function(){});
}

}
function LCOL(c){return {W:'#f5f2e6',R:'#e8544e',G:'#46c37b',Y:'#f2b134',Bu:'#5b86fb',Or:'#f2913a',Vi:'#c47ff0',Am:'#ffc857'}[c]||'#f5f2e6';}
function fariStatus(t){var el=$('fariInfo');if(el)el.textContent=t;}
function fid(f){var p=f.properties,c=f.geometry.coordinates;return p.ref||(c[1].toFixed(5)+','+c[0].toFixed(5));}

var _R=6371000, _rad=Math.PI/180;
function frDest(lat,lon,brg,dM){var d=dM/_R,b=brg*_rad,f1=lat*_rad,l1=lon*_rad;
  var f2=Math.asin(Math.sin(f1)*Math.cos(d)+Math.cos(f1)*Math.sin(d)*Math.cos(b));
  var l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(f1),Math.cos(d)-Math.sin(f1)*Math.sin(f2));
  return [f2/_rad,l2/_rad];}
function frBrg(la1,lo1,la2,lo2){var f1=la1*_rad,f2=la2*_rad,dl=(lo2-lo1)*_rad;
  var y=Math.sin(dl)*Math.cos(f2),x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);
  return (Math.atan2(y,x)/_rad+360)%360;}
function frDist(la1,lo1,la2,lo2){var f1=la1*_rad,f2=la2*_rad,df=(la2-la1)*_rad,dl=(lo2-lo1)*_rad;
  var a=Math.sin(df/2)*Math.sin(df/2)+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)*Math.sin(dl/2);
  return _R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function frInSector(brg,s,e){var delta=((e-s)%360+360)%360,off=((brg-s)%360+360)%360;return off<=delta;}
function frWedge(lat,lon,s,e,r){var delta=((e-s)%360+360)%360;if(delta===0)delta=360;
  var steps=Math.max(3,Math.round(delta/3)),pts=[[lat,lon]],i;
  for(i=0;i<=steps;i++){pts.push(frDest(lat,lon,s+delta*(i/steps)+180,r));} // +180: si disegna dal faro (settori dati "from seaward")
  pts.push([lat,lon]);return pts;}

function loadFari(){
  if(fariData){fariRender();return;}
  fariStatus('Caricamento fari…');
  fetch('fari.geojson').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){fariData=j;fariRender();})
    .catch(function(err){fariStatus('Fari: '+((err&&err.message)||'errore')+' — fari.geojson in carta/ nel repo?');});
}
function fariRender(){
  if(!fariOn)return;
  fariLayer.clearLayers();
  if(!fariData)return;
  if(fariMode==='vedo'){fariRenderVedo();return;}
  var z=map.getZoom();
  if(z<FARI_MINZOOM){fariStatus('Zooma (≥'+FARI_MINZOOM+') per gli spicchi di settore');return;}
  var b=map.getBounds().pad(0.2),n=0,m=0;
  fariData.features.forEach(function(f){
    var p=f.properties;
    var c=f.geometry.coordinates,lat=c[1],lon=c[0];
    if(!b.contains([lat,lon]))return;
    if(p.ss){
      n++;
      var isSel=(fariSel===fid(f));
      p.ss.forEach(function(s){
        var col=s[0]||'W',rr=s[3],radM=(isSel&&rr)?rr*1852:FARI_SYMRAD;
        var poly=frWedge(lat,lon,s[1],s[2],radM);
        L.polygon(poly,{pane:'fariPane',color:'#0a0e0f',weight:4,opacity:.4,fill:false}).addTo(fariLayer);
        L.polygon(poly,{pane:'fariPane',color:LCOL(col),weight:1.4,fillColor:LCOL(col),
          fillOpacity:isSel?.30:.38,dashArray:isSel?null:'3 4'})
          .addTo(fariLayer).on('click',function(e){L.DomEvent.stopPropagation(e);fariPick(f);});
      });
      fariDot(f,lat,lon,4,'#111','#ffd24a',1);
    }else if(p.ar){
      m++;
      fariDot(f,lat,lon,3,LCOL(p.ar[0][0]||'W'),'#0a0e0f',.55);
    }
  });
  fariStatus(n+' con settori · '+m+' all-round in vista'+(fariSel?' · 1 espanso (portata reale)':''));
}
function fariRenderVedo(){
  if(!POS){fariStatus('Cosa vedo: posizione non disponibile');return;}
  var n=0;
  fariData.features.forEach(function(f){
    var p=f.properties,c=f.geometry.coordinates,lat=c[1],lon=c[0];
    var d=frDist(POS[0],POS[1],lat,lon)/1852,brg=frBrg(POS[0],POS[1],lat,lon);
    var col=null,rng=null,i,s;
    if(p.ss){for(i=0;i<p.ss.length;i++){s=p.ss[i];if(frInSector(brg,s[1],s[2])){col=s[0];rng=s[3];break;}}}
    else if(p.ar){col=p.ar[0][0]||'W';rng=p.ar[0][1];}
    else return;
    if(col===null)return;                 // fuori dai settori luminosi
    if(!rng||d>rng)return;                 // senza portata nota o fuori portata -> non affermo la visibilità
    n++;
    L.polyline([POS,[lat,lon]],{pane:'fariPane',color:'#0a0e0f',weight:5,opacity:.4}).addTo(fariLayer);
    L.polyline([POS,[lat,lon]],{pane:'fariPane',color:LCOL(col),weight:3,opacity:.95}).addTo(fariLayer)
      .bindTooltip((col||'?')+' '+Math.round(brg)+'°T '+d.toFixed(1)+'M',
        {permanent:true,direction:'center',className:'fari-lbl'});
  });
  fariStatus(n?('Vedi '+n+' fari da qui'):'Nessun faro in vista da qui');
}
function fariTy(ty){ty=ty||'';
  if(ty.indexOf('buoy')>=0)return 'Boa';
  if(ty.indexOf('beacon')>=0)return 'Meda';
  if(ty==='lh'||ty.indexOf('light')>=0)return 'Faro';
  if(ty==='platform')return 'Piattaforma';
  return '';}
function fariNear(f){var pc=f.geometry.coordinates,p0=map.latLngToLayerPoint([pc[1],pc[0]]),out=[];
  fariData.features.forEach(function(g){var gp=g.properties;if(!(gp.ss||gp.ar))return;
    var gc=g.geometry.coordinates;if(p0.distanceTo(map.latLngToLayerPoint([gc[1],gc[0]]))<=16)out.push(g);});
  return out;}
function fariPickById(id){for(var i=0;i<fariData.features.length;i++){if(fid(fariData.features[i])===id){fariPick(fariData.features[i]);return;}}}
function fariPick(f){
  var id=fid(f);fariSel=(fariSel===id)?null:id;fariRender();
  if(fariSel!==id)return;
  var c=f.geometry.coordinates,p=f.properties,tl=fariTy(p.ty);
  var html='<b>'+esc(p.nm||p.ref||'Faro')+'</b>'+(tl?' <span style="opacity:.65">'+tl+'</span>':'')+(p.ch?'<br>'+esc(p.ch):'')+(p.ref?'<br>'+esc(p.ref):'');
  var near=fariNear(f).filter(function(g){return fid(g)!==id;});
  if(near.length){
    html+='<div class="frsep">Anche qui ('+near.length+'):</div>';
    near.forEach(function(g){var gp=g.properties,gt=fariTy(gp.ty);
      html+='<a href="#" class="frsib" data-id="'+esc(fid(g))+'">▸ '+esc(gp.nm||gp.ref||'Faro')+(gt?' · '+gt:'')+(gp.ch?' · '+esc(gp.ch):'')+'</a>';});
  }
  var pop=L.popup({className:'fari-pop'}).setLatLng([c[1],c[0]]).setContent(html).openOn(map);
  var el=pop.getElement?pop.getElement():null;
  if(el){var links=el.querySelectorAll('.frsib');for(var k=0;k<links.length;k++){(function(a){a.addEventListener('click',function(e){e.preventDefault();L.DomEvent.stop(e);fariPickById(a.getAttribute('data-id'));});})(links[k]);}}
}
function fariModeSync(){$('fariModeSett').classList.toggle('on',fariMode==='sett');$('fariModeVedo').classList.toggle('on',fariMode==='vedo');}
$('tFari').onclick=function(){
  fariOn=!fariOn;this.classList.toggle('on',fariOn);
  $('fariCtl').style.display=fariOn?'flex':'none';
  if(fariOn){fariLayer.addTo(map);fariModeSync();loadFari();}
  else{map.removeLayer(fariLayer);fariLayer.clearLayers();fariSel=null;}
};
$('fariModeSett').onclick=function(){fariMode='sett';fariSel=null;fariModeSync();fariRender();};
$('fariModeVedo').onclick=function(){fariMode='vedo';fariSel=null;fariModeSync();fariRender();};
map.on('moveend',function(){if(fariOn)fariRender();});
map.on('click',function(){if(fariOn&&fariSel){fariSel=null;fariRender();}});
/* ===== fine FARI ===== */

/* ---- persistenza vista carta (raffyca-carta-view) ---- */
function saveView(){try{
  var c=map.getCenter();
  var base=map.hasLayer(baseOSM)?'osm':map.hasLayer(baseSat)?'sat':'nautica';
  localStorage.setItem('raffyca-carta-view',JSON.stringify({
    c:[+c.lat.toFixed(5),+c.lng.toFixed(5)],z:map.getZoom(),base:base,sea:map.hasLayer(seamark),
    grid:gridOn,zones:zonesOn,bathy:isoOn,fari:fariOn,fariMode:fariMode}));
  if(SYNCV)localStorage.setItem(MVKEY,JSON.stringify({c:[+c.lat.toFixed(5),+c.lng.toFixed(5)],z:map.getZoom()}));
}catch(e){}}
map.on('moveend zoomend baselayerchange overlayadd overlayremove',saveView);
['tGrid','tZone','tBathy','tFari','fariModeSett','fariModeVedo'].forEach(function(id){
  var el=$(id);if(el)el.addEventListener('click',function(){setTimeout(saveView,0);});});
/* Gli overlay NON si riaccendono all'apertura: la Carta si apre pulita, con la
   sola base + simboli nautici. Griglia, zone venti, batimetria e fari sono strati
   d'analisi, si accendono quando servono; ritrovarli accesi il giorno dopo vuol
   dire aprire su una carta illeggibile e non ricordarsi perche'. Restano invece
   persistiti base, centro e zoom (la parte utile della voce 08/08).
   I campi grid/zones/bathy/fari continuano a essere SCRITTI in raffyca-carta-view:
   non costano nulla e servono se un giorno si vuole un'opzione "riapri com'era". */

render();
setTimeout(function(){map.invalidateSize();if(POS&&!VIEW0)map.setView(POS,12);},300);
</script>
