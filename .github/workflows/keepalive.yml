# Tiene sveglio il progetto Supabase.
#
# Il piano gratuito sospende un progetto rimasto inattivo per una settimana, e
# riattivarlo e' manuale: se Dritta non si usa per qualche settimana — d'inverno
# capita — la Posizione Live sarebbe morta proprio il giorno in cui serve.
# Questo workflow fa una chiamata sola ogni tre giorni.
#
# Chiama get_pos e non un endpoint qualunque perche' deve toccare il DATABASE:
# una richiesta che si ferma all'API REST non conta come attivita'. La sessione
# chiesta non esiste, la risposta e' `null`, e non si scrive niente.
#
# ATTENZIONE: GitHub disattiva i workflow schedulati dopo 60 giorni senza commit
# sul repository. Se Dritta resta ferma davvero a lungo, il guardiano si
# addormenta con lei; in quel caso il workflow va riattivato a mano dalla
# scheda Actions.
#
# Segreti da creare in Settings → Secrets and variables → Actions:
#   SUPABASE_URL       https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  la anon public key del progetto

name: keepalive Supabase

on:
  schedule:
    # ogni tre giorni alle 05:17 UTC — un orario spostato, non alle ore tonde,
    # quando i runner di GitHub sono in coda
    - cron: "17 5 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Una chiamata leggera al database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Segreti SUPABASE_URL / SUPABASE_ANON_KEY non configurati."
            exit 1
          fi
          codice=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            "${SUPABASE_URL%/}/rest/v1/rpc/get_pos" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_session":"keepalive"}')
          echo "HTTP $codice"
          # 200 con corpo `null` e' la risposta attesa: la sessione non esiste.
          [ "$codice" = "200" ]
